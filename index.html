<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RR Auction Intelligence · Pressure Performers</title>
<script src="echarts.min.js"></script>
<style>
:root{--navy:#0b1437;--navy2:#16225a;--pink:#ea1a8c;--gold:#c9a227;--bg:#f5f6fb;--card:#fff;--ink:#141a33;--mut:#6b7392;--line:#e4e7f2}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:236px;background:var(--navy);color:#cfd5ef;padding:20px 12px;position:sticky;top:0;height:100vh;flex:none;overflow:auto}
aside h1{font-size:15px;color:#fff;margin:0 8px 2px}aside small{display:block;margin:0 8px 18px;color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
aside a{display:block;padding:9px 12px;border-radius:9px;color:#cfd5ef;cursor:pointer;margin:2px 0}aside a:hover{background:var(--navy2)}aside a.on{background:linear-gradient(90deg,var(--pink),#b3126d);color:#fff}
main{flex:1;padding:24px;min-width:0}h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(11,20,55,.06);margin-bottom:16px}
.card h3{margin:0 0 2px;font-size:15px}.def{color:var(--mut);font-size:12px;margin:0 0 8px}
.grid{display:grid;gap:16px}.grid>*{min-width:0}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpi{border-top:3px solid var(--gold)}tr:hover td{background:#fdf4fa}.btn{margin-top:6px;font-size:12px}.kpi b{display:block;font-size:26px;color:var(--navy)}.kpi span{color:var(--mut);font-size:12px}
.chart{height:340px;width:100%}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}th{cursor:pointer;color:var(--mut);font-weight:600;position:sticky;top:0;background:#fff}th:hover{color:var(--pink)}.tw{overflow:auto;max-height:480px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}input,select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}button{cursor:pointer}button.p{background:var(--pink);color:#fff;border:0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:#fdeaf5;color:var(--pink)}.tag.g{background:#faf3d6;color:#8a6d00}.tag.n{background:#e7eaf8;color:var(--navy2)}
.warn{background:#fff8e1;border:1px solid #f1d98a;color:#6d5600;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--navy);color:#fff;border-radius:99px;padding:3px 10px;margin:2px}.chip i{cursor:pointer;font-style:normal;color:var(--gold)}
.sl{display:flex;align-items:center;gap:6px;font-size:12px}.sl input{width:90px;padding:0}
@media(max-width:820px){body{display:block}aside{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px;padding:10px}aside h1,aside small{width:100%}aside a{padding:6px 10px}main{padding:14px}.g2{grid-template-columns:1fr}}
</style></head><body>
<aside><h1>Rajasthan Royals</h1><small>Auction Intelligence · IPL 2027</small><div id="nav"></div></aside>
<main id="main"><p>Loading…</p></main>
<script src="data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s),LG=D.league,CK=D.checks;
const P=Object.fromEntries(D.players.map(p=>[p.id,p]));
const st={sec:'A',grp:'ALL',minB:100,minW:60,cat:'Batters',sort:{},q:'',cmp:[],scn:'A',squad:{A:[],B:[]},
 wB:{sr:.30,out:.20,bd:.10,cons:.25,base:.15},wW:{ec:.30,wk:.20,dot:.15,cons:.20,base:.15}};
const f1=x=>x==null||!isFinite(x)?'–':x.toFixed(1),f2=x=>x==null||!isFinite(x)?'–':x.toFixed(2),pc=x=>x==null||!isFinite(x)?'–':(x*100).toFixed(0)+'%';
const getB=(g,k,id)=>D.stat.bat[g+'|'+k][id]||[0,0,0,0,0,0],getW=(g,k,id)=>D.stat.bowl[g+'|'+k][id]||[0,0,0,0,0];
const lgBat=k=>LG[k].bat,lgBowl=k=>LG[k].bowl;
const sr=(r,b)=>b?r/b*100:NaN, ec=(b,r)=>b?r/b*6:NaN, shr=(x,n,pri,k)=>(x+k*pri)/(n+k);
/* ---------- rating engine (formulas documented in README + Rankings tab) ---------- */
function batRow(id,g){const a=getB(g,'press',id),z=getB(g,'base',id),lp=lgBat('press'),lb=lgBat('base'),K=60;
 const pSR=shr(a[0],a[1],lp[0]/lp[1],K)*100,bSR=shr(z[0],z[1],lb[0]/lb[1],K)*100;

 const lo=lgOutRate('press'),aOut=shr(a[5],a[1],lo,K),bdr=shr(a[2],a[1],lp[2]/lp[1],K),c=D.cons.bat[id]||[0,0];
 const cons=(c[1]+3*.5)/(c[0]+3),w=st.wB;
 const idx={sr:pSR/(lp[0]/lp[1]*100),out:lo/aOut,bd:bdr/(lp[2]/lp[1]),cons:cons/.5,base:pSR/bSR/ (lgPSRbase())};
 const score=100*(w.sr*idx.sr+w.out*idx.out+w.bd*idx.bd+w.cons*idx.cons+w.base*idx.base)/(w.sr+w.out+w.bd+w.cons+w.base);
 return{id,n:P[id].n,t:P[id].t26,pb:a[1],pr:a[0],po:a[5],pSR:sr(a[0],a[1]),bSR:sr(z[0],z[1]),bnd:a[1]?a[2]/a[1]:NaN,dot:a[1]?a[3]/a[1]:NaN,cons:c[0]?c[1]/c[0]:NaN,cq:c[0],
 dSR:sr(...[getB(g,'death',id)[0],getB(g,'death',id)[1]]),dB:getB(g,'death',id)[1],cSR:sr(getB(g,'close',id)[0],getB(g,'close',id)[1]),cB:getB(g,'close',id)[1],
 chSR:sr(getB(g,'chaseP',id)[0],getB(g,'chaseP',id)[1]),chB:getB(g,'chaseP',id)[1],allB:getB(g,'all',id)[1],allR:getB(g,'all',id)[0],allO:getB(g,'all',id)[5],bo:P[id].bo,idx,score}}
const lgOutRate=k=>{const t=Object.values(D.stat.bat['ALL|'+k]);let b=0,o=0;t.forEach(r=>{b+=r[1];o+=r[5]});return o/b};
let _lb=null;const lgPSRbase=()=>{if(!_lb){const p=lgBat('press'),b=lgBat('base');_lb=(p[0]/p[1])/(b[0]/b[1])}return _lb};
function bowlRow(id,g){const a=getW(g,'press',id),z=getW(g,'base',id),lp=lgBowl('press'),lb=lgBowl('base'),K=30;
 const pE=shr(a[1],a[0],lp[1]/lp[0],K)*6,bE=shr(z[1],z[0],lb[1]/lb[0],K)*6,wk=shr(a[2],a[0],lp[2]/lp[0],K),dt=shr(a[3],a[0],lp[3]/lp[0],K),c=D.cons.bowl[id]||[0,0];
 const cons=(c[1]+3*.5)/(c[0]+3),w=st.wW,lpE=lp[1]/lp[0]*6,lbE=lb[1]/lb[0]*6;
 const idx={ec:lpE/pE,wk:wk/(lp[2]/lp[0]),dot:dt/(lp[3]/lp[0]),cons:cons/.5,base:(bE/pE)/(lbE/lpE)};
 const score=100*(w.ec*idx.ec+w.wk*idx.wk+w.dot*idx.dot+w.cons*idx.cons+w.base*idx.base)/(w.ec+w.wk+w.dot+w.cons+w.base);
 const d=getW(g,'death',id),pp=getW(g,'pp',id),mi=getW(g,'mid',id),cl=getW(g,'close',id),al=getW(g,'all',id);
 return{id,n:P[id].n,t:P[id].t26,ps:P[id].ps,pb:a[0],pw:a[2],pE:ec(a[0],a[1]),bE:ec(z[0],z[1]),wb:a[0]&&a[2]?a[0]/a[2]:NaN,dot:a[0]?a[3]/a[0]:NaN,cons:c[0]?c[1]/c[0]:NaN,cq:c[0],
 dE:ec(d[0],d[1]),dB:d[0],dW:d[2],ppE:ec(pp[0],pp[1]),ppB:pp[0],mE:ec(mi[0],mi[1]),mB:mi[0],cE:ec(cl[0],cl[1]),cB:cl[0],cW:cl[2],allB:al[0],allW:al[2],allE:ec(al[0],al[1]),idx,score}}
const batters=()=>D.players.filter(p=>getB(st.grp,'all',p.id)[1]>0).map(p=>batRow(p.id,st.grp));
const bowlers=()=>D.players.filter(p=>getW(st.grp,'all',p.id)[0]>0).map(p=>bowlRow(p.id,st.grp));
function cats(){const B=batters().filter(r=>r.pb>=st.minB),W=bowlers().filter(r=>r.pb>=st.minW),ws=Object.fromEntries(W.map(r=>[r.id,r]));
 const bs=Object.fromEntries(batters().map(r=>[r.id,r]));
 const ar=B.filter(r=>ws[r.id]&&ws[r.id].allB>=120&&r.allB>=150).map(r=>({...r,bw:ws[r.id]}));
 return{'Batters':B.sort((a,b)=>b.score-a.score),
 'Finishers':B.filter(r=>r.bo>=5&&r.dB>=40).sort((a,b)=>b.score-a.score),
 'All-rounders':ar.sort((a,b)=>(b.score+b.bw.score)-(a.score+a.bw.score)),
 'Pace bowlers':W.filter(r=>r.ps==='Pace').sort((a,b)=>b.score-a.score),'Spin bowlers':W.filter(r=>r.ps==='Spin').sort((a,b)=>b.score-a.score)}}
/* ---------- UI helpers ---------- */
const charts=[];function ch(id,opt){const e=echarts.init(document.getElementById(id));e.setOption({textStyle:{fontFamily:'inherit'},color:['#ea1a8c','#0b1437','#c9a227','#4b5fd1','#18a999','#f08c3a'],grid:{left:55,right:20,top:40,bottom:50},tooltip:{},...opt});charts.push(e)}
addEventListener('resize',()=>charts.forEach(c=>c.resize()));
const card=(t,d,body)=>`<div class="card"><h3>${t}</h3><p class="def">${d||''}</p>${body}</div>`;
function table(id,cols,rows,sk){(window._tb=window._tb||{})[id]={cols,rows};const s=st.sort[id]||sk||cols[1][0];const dir=(st.sort[id+'d']??-1);rows=[...rows].sort((a,b)=>{const x=a[s],y=b[s];return(isNaN(x)?-1e9:x)<(isNaN(y)?-1e9:y)?-dir:dir});
 return`<div class="tw"><table><tr>${cols.map(c=>`<th class="${c[0]=='n'?'l':''}" onclick="srt('${id}','${c[0]}')">${c[1]}${s==c[0]?(dir<0?' ▼':' ▲'):''}</th>`).join('')}</tr>${rows.slice(0,200).map(r=>`<tr>${cols.map(c=>`<td class="${c[0]=='n'?'l':''}">${c[2]?c[2](r[c[0]],r):r[c[0]]}</td>`).join('')}</tr>`).join('')}</table></div><p class="def">${rows.length} players shown (max 200). Click headers to sort. <button class="btn" onclick="csv('${id}')">Export CSV</button></p>`}
window.csv=id=>{const t=_tb[id],c=t.cols.filter(x=>x[0]!='rank'||true);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const txt=[c.map(x=>q(x[1])).join(',')].concat(t.rows.map(r=>c.map(x=>q(typeof r[x[0]]=='number'&&isFinite(r[x[0]])?+r[x[0]].toFixed(3):r[x[0]])).join(','))).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=id+'.csv';a.click()};
window.srt=(id,k)=>{st.sort[id+'d']=st.sort[id]==k?-(st.sort[id+'d']??-1):-1;st.sort[id]=k;render()};
const ctl=(extra='')=>`<div class="bar"><select onchange="st.grp=this.value;render()">${['ALL','IPL','T20I'].map(g=>`<option ${g==st.grp?'selected':''} value="${g}">${g=='ALL'?'All competitions':g}</option>`).join('')}</select>
 <label class="sl">Min pressure balls (bat) <input type="range" min="0" max="200" step="10" value="${st.minB}" onchange="st.minB=+this.value;render()"> <b>${st.minB}</b></label>
 <label class="sl">Min pressure balls (bowl) <input type="range" min="0" max="150" step="6" value="${st.minW}" onchange="st.minW=+this.value;render()"> <b>${st.minW}</b></label>
 <input placeholder="Search player…" value="${st.q}" oninput="st.q=this.value;clearTimeout(window._t);window._t=setTimeout(render,250)">${extra}</div>`;
const flt=r=>!st.q||r.n.toLowerCase().includes(st.q.toLowerCase());
const nameCell=(v,r)=>`${v}${r.t?` <span class="tag n">${r.t.split(' ').map(w=>w[0]).join('')}</span>`:''}`;
const sampleTag='<span class="tag g">Raw</span> counts/rates · <span class="tag">Derived</span> index = shrunk rate ÷ league pressure rate';
function bar(id,title,rows,key,fmt,xname){rows=rows.slice(0,15).reverse();ch(id,{title:{text:title,textStyle:{fontSize:13}},grid:{left:130,right:30,top:35,bottom:35},tooltip:{formatter:p=>{const r=rows[p.dataIndex];return`<b>${r.n}</b><br>${xname}: ${fmt(r[key])}<br>Pressure balls: ${r.pb}`}},xAxis:{type:'value',name:xname},yAxis:{type:'category',data:rows.map(r=>r.n)},series:[{type:'bar',data:rows.map(r=>r[key]),itemStyle:{color:'#ea1a8c',borderRadius:[0,5,5,0]}}]})}
/* ---------- sections ---------- */
const S={};
S.A=()=>{const c=cats(),b=c.Batters.slice(0,5),w=c['Pace bowlers'].concat(c['Spin bowlers']).sort((a,b)=>b.score-a.score).slice(0,5);
 const p=lgBat('press'),q=lgBat('base'),pb=lgBowl('press'),qb=lgBowl('base');
 return`<h2>Executive Overview</h2><p class="sub">Reliable performers under pressure · IPL 2022–26 + T20Is (supplied RR data pack)</p>
 <div class="warn"><b>Scope & limits:</b> ${CK.data_note} Auction availability is <b>unverified</b>; nothing here implies a player will be in the 2027 auction.</div>
 <div class="grid g4">${[['Matches analysed',CK.matches_in_bbb+' / '+CK.matches_total+' (16 abandoned, no balls)'],['Deliveries (inn. 1–2)',CK.balls.toLocaleString()],['Players evaluated',D.players.length],['Close matches (derived)',CK.close_matches+' of '+CK.clean_matches]].map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
 <div class="grid g2">${card('Strike rate by situation','League-wide runs per 100 balls faced (raw)',`<div id="c1" class="chart"></div>`)}${card('Economy by situation','League-wide runs conceded per over (raw)',`<div id="c2" class="chart"></div>`)}</div>
 <div class="grid g2">${card('Top batters under pressure (default weights)',`Min ${st.minB} pressure balls · ${st.grp}`,table('oa',[['n','Player',nameCell],['score','Score',f1],['pb','Press. balls'],['pSR','Press. SR',f1],['cons','Consistency',pc]],b,'score'))}
 ${card('Top bowlers under pressure (default weights)',`Min ${st.minW} pressure balls · ${st.grp}`,table('ob',[['n','Player',nameCell],['score','Score',f1],['pb','Press. balls'],['pE','Press. Econ',f2],['pw','Wkts']],w,'score'))}</div>
 ${card('Key insights (computed from data)','',`<ul><li>League batting SR in pressure situations is <b>${f1(sr(p[0],p[1]))}</b> vs <b>${f1(sr(q[0],q[1]))}</b> in ordinary balls (n=${p[1].toLocaleString()} / ${q[1].toLocaleString()} balls) — pressure here is dominated by death overs, where batters attack but lose wickets.</li>
 <li>League bowling economy in pressure situations is <b>${f2(ec(pb[0],pb[1]))}</b> vs <b>${f2(ec(qb[0],qb[1]))}</b> otherwise.</li>
 <li>Ball-by-ball totals reproduce the recorded winner in <b>${CK.winner_matches_totals_pct}%</b> of ${CK.winner_check_n} decisive matches — a data-integrity check.</li><li>Ratings are descriptive associations in a limited sample, not proof of temperament.</li></ul>`)}`};
S.A.after=()=>{const K=[['pp','Powerplay'],['mid','Middle'],['death','Death'],['chaseP','High-pressure chase'],['close','Close match'],['base','Ordinary']];
 const mk=(t,y,fn,col)=>({title:{text:t,textStyle:{fontSize:13}},grid:{left:60,right:20,top:40,bottom:60},xAxis:{type:'category',data:K.map(x=>x[1]),name:'Situation',axisLabel:{interval:0,rotate:20}},yAxis:{type:'value',name:y},tooltip:{formatter:p=>`${p.name}: ${p.value}<br>${lgBat(K[p.dataIndex][0])[1].toLocaleString()} balls faced`},series:[{type:'bar',data:K.map(x=>+fn(x[0]).toFixed(2)),itemStyle:{color:col,borderRadius:[5,5,0,0]},label:{show:true,position:'top'}}]});
 ch('c1',mk('Strike rate','Runs per 100 balls',k=>sr(lgBat(k)[0],lgBat(k)[1]),'#ea1a8c'));ch('c2',mk('Economy','Runs per over',k=>ec(lgBowl(k)[0],lgBowl(k)[1]),'#0b1437'))};
S.B=()=>{const g=['IPL','T20I'],ph=['PP','MID','DEATH'];const L=LG.byGrp;
 const rows=[['pp','Powerplay (1–6)'],['mid','Middle (7–15)'],['death','Death (16–20)'],['chase','All chasing balls'],['chaseP','High-pressure chase'],['close','Close-match balls'],['press','ANY pressure'],['base','Ordinary (baseline)']].map(([k,n])=>{const a=lgBat(k),b=lgBowl(k);return{n,balls:a[1],sr:sr(a[0],a[1]),bnd:a[2]/a[1],dot:a[3]/a[1],econ:ec(b[0],b[1]),wk:b[2]/b[0]*6*20/6}});
 return`<h2>Pressure Performance Analytics</h2><p class="sub">How pressure is defined, how large each sample is, and how it differs from ordinary play</p>
 ${card('Pressure definitions','Applied ball-by-ball; innings 1–2 only (super overs excluded)',`<ul><li><b>Death overs:</b> overs 16–20, either innings.</li><li><b>High-pressure chase:</b> 2nd innings, over ≥7, required rate ≥ 9.5 per over (target = 1st-inn total + 1; balls left from legal deliveries; rain-revised matches excluded).</li><li><b>Pressure ball</b> = death OR high-pressure chase. <b>Ordinary ball</b> = all others (used as each player's own baseline).</li><li><b>Close match</b> (derived from deliveries): chase fell short/tied by ≤10 runs, or won with ≤6 balls to spare. Reported separately as context; not part of the pressure flag.</li><li>Legal ball excludes wides and no-balls; bowler wickets exclude run-outs/retired/obstruction; bowler runs exclude byes and leg-byes.</li></ul>`)}
 ${card('Situation sample sizes & league rates','Raw league-wide numbers',table('pb',[['n','Situation'],['balls','Batting balls',x=>x.toLocaleString()],['sr','SR',f1],['bnd','Boundary %',pc],['dot','Dot %',pc],['econ','Econ',f2]],rows,'balls'))}
 <div class="grid g2">${card('League strike rate by phase','Runs per 100 balls faced; heat = higher rate',`<div id="c1" class="chart"></div>`)}${card('League economy by phase','Runs conceded per over (excl. byes/leg-byes)',`<div id="c2" class="chart"></div>`)}</div>`};
S.B.after=()=>{const g=['IPL','T20I'],ph=['PP','MID','DEATH'],L=LG.byGrp,hm=(fn,t,x,y)=>({title:{text:t,textStyle:{fontSize:13}},xAxis:{type:'category',data:ph,name:'Phase'},yAxis:{type:'category',data:g,name:'Competition'},visualMap:{min:x,max:y,calculable:false,orient:'horizontal',left:'center',bottom:0,inRange:{color:['#fdeaf5','#ea1a8c']}},series:[{type:'heatmap',data:g.flatMap((a,i)=>ph.map((p,j)=>[j,i,+fn(L[a][p]).toFixed(2)])),label:{show:true},}],tooltip:{formatter:p=>`${g[p.value[1]]} ${ph[p.value[0]]}: ${p.value[2]}`}});
 ch('c1',hm(o=>sr(o.bat[0],o.bat[1]),'Strike rate',100,180));ch('c2',hm(o=>ec(o.bowl[0],o.bowl[1]),'Economy',6.5,11))};
S.C=()=>{const R=batters().filter(r=>r.pb>=st.minB&&flt(r));return`<h2>Batting Intelligence</h2><p class="sub">${sampleTag}</p>${ctl()}
 <div class="grid g2">${card('Top pressure strike rate (shrunk to league)','Derived index score shown in table; bars = raw pressure SR',`<div id="c1" class="chart"></div>`)}${card('Strike rate vs consistency','x = pressure SR (raw), y = share of pressure innings (≥4 balls) with SR ≥ league pressure SR; bubble = pressure balls',`<div id="c2" class="chart"></div>`)}</div>
 ${card('Batting table','Pressure = death or high-pressure chase. Dismissal = balls per dismissal in pressure.',table('bt',[['n','Player',nameCell],['score','Score',f1],['pb','Press. balls'],['pr','Runs'],['pSR','Press. SR',f1],['bSR','Base SR',f1],['bnd','Bnd %',pc],['dot','Dot %',pc],['po','Outs'],['dSR','Death SR',f1],['dB','Death b'],['cSR','Close SR',f1],['cB','Close b'],['chSR','Hi-chase SR',f1],['chB','Hi-chase b'],['cons','Consist.',pc],['cq','Inns']],R,'score'))}`};
S.C.after=()=>{const R=batters().filter(r=>r.pb>=st.minB&&flt(r));bar('c1','Top 15 by pressure strike rate',[...R].sort((a,b)=>b.pSR-a.pSR),'pSR',f1,'Pressure SR');
 ch('c2',{xAxis:{type:'value',name:'Pressure SR',min:100},yAxis:{type:'value',name:'Consistency',axisLabel:{formatter:v=>(v*100)+'%'}},tooltip:{formatter:p=>`<b>${p.data[3]}</b><br>SR ${f1(p.data[0])} · consistency ${pc(p.data[1])}<br>${p.data[2]} pressure balls`},series:[{type:'scatter',symbolSize:d=>Math.max(6,Math.sqrt(d[2])*1.4),data:R.filter(r=>r.cq>=3).map(r=>[r.pSR,r.cons,r.pb,r.n]),itemStyle:{color:'rgba(234,26,140,.6)'}}]})};
S.D=()=>{const R=bowlers().filter(r=>r.pb>=st.minW&&flt(r));return`<h2>Bowling Intelligence</h2><p class="sub">${sampleTag}</p>${ctl()}
 <div class="grid g2">${card('Lowest pressure economy','Raw runs per over in pressure situations',`<div id="c1" class="chart"></div>`)}${card('Economy vs wicket frequency','x = balls per wicket (lower = better), y = pressure economy',`<div id="c2" class="chart"></div>`)}</div>
 ${card('Bowling table','Wickets exclude run-outs. Pressure = death or high-pressure chase.',table('wt',[['n','Player',nameCell],['ps','Type'],['score','Score',f1],['pb','Press. balls'],['pE','Press. Econ',f2],['bE','Base Econ',f2],['pw','Wkts'],['wb','Balls/wkt',f1],['dot','Dot %',pc],['dE','Death Econ',f2],['dB','Death b'],['ppE','PP Econ',f2],['ppB','PP b'],['mE','Mid Econ',f2],['mB','Mid b'],['cE','Close Econ',f2],['cB','Close b'],['cons','Consist.',pc]],R,'score'))}
 ${card('Performance vs opposition','Pick a bowler (min 12 balls vs a team, all balls)',`<select id="ob" onchange="oppC()">${R.slice(0,60).map(r=>`<option value="${r.id}">${r.n}</option>`).join('')}</select><div id="c3" class="chart"></div>`)}`};
window.oppC=()=>{const id=$('#ob')?.value;if(!id)return;const o=D.opp[id]||{},k=Object.keys(o);ch('c3',{title:{text:P[id].n+' — economy by opposition',textStyle:{fontSize:13}},grid:{left:55,right:20,top:40,bottom:110},xAxis:{type:'category',data:k,axisLabel:{rotate:45}},yAxis:{type:'value',name:'Economy'},tooltip:{formatter:p=>`${k[p.dataIndex]}<br>Econ ${f2(ec(o[k[p.dataIndex]][0],o[k[p.dataIndex]][1]))}<br>${o[k[p.dataIndex]][0]} balls, ${o[k[p.dataIndex]][2]} wkts`},series:[{type:'bar',data:k.map(t=>ec(o[t][0],o[t][1])),itemStyle:{color:'#0b1437'}}]})};
S.D.after=()=>{const R=bowlers().filter(r=>r.pb>=st.minW&&flt(r));bar('c1','Top 15 lowest pressure economy',[...R].sort((a,b)=>a.pE-b.pE),'pE',f2,'Pressure Econ');
 ch('c2',{xAxis:{type:'value',name:'Balls per wicket (pressure)',max:60},yAxis:{type:'value',name:'Economy',min:6},tooltip:{formatter:p=>`<b>${p.data[3]}</b><br>${f1(p.data[0])} b/wkt · econ ${f2(p.data[1])}<br>${p.data[2]} balls`},series:[{type:'scatter',symbolSize:d=>Math.max(6,Math.sqrt(d[2])*1.3),data:R.filter(r=>r.pw>0).map(r=>[r.wb,r.pE,r.pb,r.n]),itemStyle:{color:'rgba(11,20,55,.6)'}}]});oppC()};
const WL={B:{sr:'Pressure SR index',out:'Dismissal-avoidance index',bd:'Boundary % index',cons:'Consistency index',base:'Pressure-vs-own-baseline index'},W:{ec:'Economy index',wk:'Wicket-rate index',dot:'Dot-ball index',cons:'Consistency index',base:'Pressure-vs-own-baseline index'}};
const sliders=(k,w)=>Object.keys(w).map(x=>`<label class="sl">${WL[k][x]} <input type="range" min="0" max="1" step=".05" value="${w[x]}" onchange="st.w${k}['${x}']=+this.value;render()"> <b>${w[x]}</b></label>`).join('');
S.E=()=>{const C=cats(),L=C[st.cat].filter(flt),bw=['Pace bowlers','Spin bowlers'].includes(st.cat),ar=st.cat=='All-rounders';
 const cols=bw?[['n','Player',nameCell],['score','Score',f1],['pb','Press. balls'],['pE','Econ',f2],['pw','Wkts'],['dot','Dot %',pc],['cons','Consist.',pc],['i1','Econ idx',f2],['i2','Wkt idx',f2],['i3','Dot idx',f2],['i4','Cons idx',f2],['i5','vs base',f2]]:[['n','Player',nameCell],['score',ar?'Bat+Bowl':'Score',f1],['pb','Press. balls'],['pSR','SR',f1],['po','Outs'],['bnd','Bnd %',pc],['cons','Consist.',pc],['i1','SR idx',f2],['i2','Out idx',f2],['i3','Bnd idx',f2],['i4','Cons idx',f2],['i5','vs base',f2]];
 const rows=L.map(r=>{const x=r.idx,v=bw?[x.ec,x.wk,x.dot,x.cons,x.base]:[x.sr,x.out,x.bd,x.cons,x.base];return{...r,score:ar?r.score+r.bw.score:r.score,i1:v[0],i2:v[1],i3:v[2],i4:v[3],i5:v[4]}});
 return`<h2>Pressure Player Rankings</h2><p class="sub">Transparent, configurable weighted index. Role categories below.</p>
 ${ctl(`<select onchange="st.cat=this.value;render()">${Object.keys(C).map(c=>`<option ${c==st.cat?'selected':''}>${c}</option>`).join('')}</select>`)}
 ${card('Weights (re-rank live)','Index = shrunk player rate ÷ league pressure rate (1.00 = league average). Score = 100 × weighted mean of indices.',`<div class="bar">${sliders('B',st.wB)}</div><div class="bar">${sliders('W',st.wW)}</div>`)}
 ${card('Formula','',`<p class="def"><b>Batters:</b> shrunk SR=(runs+60·lgSR)/(balls+60); out-rate shrunk likewise (60 balls); boundary% shrunk; consistency=(ok+1.5)/(q+3)÷0.5 where ok = pressure innings (≥4 balls) with SR ≥ league; vs-base = pressure SR ÷ own ordinary SR, normalised by league ratio.<br><b>Bowlers:</b> economy, wicket rate, dot% shrunk with 30-ball prior; consistency = spells (≥6 balls) with economy ≤ league or ≥1 wicket; vs-base = ordinary econ ÷ pressure econ vs league.<br><b>Roles:</b> Finisher = avg batting position ≥5 and ≥40 death balls; All-rounder = ≥150 balls faced and ≥120 bowled (score = bat + bowl); Pace/Spin from the data's pace_or_spin field. <b>Eligibility:</b> min pressure balls (sliders). Shrinkage stops small samples topping the table.</p>`)}
 ${card(st.cat+' ranking — '+L.length+' eligible','Click a header to sort; all underlying counts shown',table('rk',[['rank','#'],...cols],rows.map((r,i)=>({...r,rank:i+1})),'score'))}`};
const cmpRows=id=>{const b=getB('ALL','all',id),w=getW('ALL','all',id);return{b,w}};
S.F=()=>{const pool=D.players.filter(p=>getB('ALL','all',p.id)[1]>=60||getW('ALL','all',p.id)[0]>=48);
 const rowsB=st.cmp.map(id=>batRow(id,st.grp)),rowsW=st.cmp.map(id=>bowlRow(id,st.grp));
 return`<h2>Player Comparison Lab</h2><p class="sub">Select 2–5 players. Competition filter applies to pressure metrics.</p>${ctl()}
 <div class="bar"><input list="pl" id="pi" placeholder="Add player…"><datalist id="pl">${pool.map(p=>`<option value="${p.n}">`).join('')}</datalist><button class="p" onclick="addC()">Add</button>${st.cmp.map(id=>`<span class="chip">${P[id].n}<i onclick="st.cmp=st.cmp.filter(x=>x!=${id});render()">×</i></span>`).join('')}</div>
 ${st.cmp.length<2?'<div class="warn">Add at least two players.</div>':`<div class="grid g2">${card('Batting radar','Index vs league pressure average (1.0 = league)',`<div id="c1" class="chart"></div>`)}${card('Bowling radar','Index vs league pressure average (1.0 = league)',`<div id="c2" class="chart"></div>`)}</div>
 ${card('Batting comparison','Raw stats with sample sizes',table('cb',[['n','Player'],['allB','All balls'],['allR','All runs'],['pb','Press. balls'],['pSR','Press. SR',f1],['dSR','Death SR',f1],['dB','Death b'],['cSR','Close SR',f1],['cB','Close b'],['chSR','Hi-chase SR',f1],['chB','b'],['bnd','Bnd %',pc],['dot','Dot %',pc],['score','Score',f1]],rowsB.filter(r=>r.allB>0),'score'))}
 ${card('Bowling comparison','Raw stats with sample sizes',table('cw',[['n','Player'],['allB','All balls'],['allE','Econ',f2],['allW','Wkts'],['pb','Press. balls'],['pE','Press. Econ',f2],['dE','Death Econ',f2],['dB','Death b'],['ppE','PP Econ',f2],['mE','Mid Econ',f2],['cE','Close Econ',f2],['cB','Close b'],['dot','Dot %',pc],['score','Score',f1]],rowsW.filter(r=>r.allB>0),'score'))}
 ${card('Competition experience','Balls faced / bowled by competition (all situations)',table('ce',[['n','Player'],['ib','IPL balls faced'],['tb','T20I balls faced'],['iw','IPL balls bowled'],['tw','T20I balls bowled'],['ro','Role']],st.cmp.map(id=>({n:P[id].n,ib:getB('IPL','all',id)[1],tb:getB('T20I','all',id)[1],iw:getW('IPL','all',id)[0],tw:getW('T20I','all',id)[0],ro:roleOf(id)})),'ib'))}
 ${card('Pressure strike-rate trend','Batting pressure SR by calendar year (balls ≥ 6 per year)',`<div id="c3" class="chart"></div>`)}`}`};
window.addC=()=>{const p=D.players.find(x=>x.n==$('#pi').value);if(p&&!st.cmp.includes(p.id)&&st.cmp.length<5){st.cmp.push(p.id);render()}};
S.F.after=()=>{if(st.cmp.length<2)return;const rad=(ids,ks,nm,fn)=>({legend:{bottom:0},tooltip:{},radar:{indicator:ks.map(k=>({name:nm[k],max:1.8,min:0})),radius:'62%'},series:[{type:'radar',data:ids.map(id=>({name:P[id].n,value:ks.map(k=>+Math.min(1.8,fn(id).idx[k]).toFixed(2))}))}]});
 ch('c1',rad(st.cmp,Object.keys(WL.B),WL.B,id=>batRow(id,st.grp)));ch('c2',rad(st.cmp,Object.keys(WL.W),WL.W,id=>bowlRow(id,st.grp)));
 const ys=D.years;ch('c3',{legend:{bottom:0},xAxis:{type:'category',data:ys,name:'Year'},yAxis:{type:'value',name:'Pressure SR'},series:st.cmp.map(id=>({name:P[id].n,type:'line',connectNulls:true,data:ys.map(y=>{const t=(D.trend.bat[id]||{})[y];return t&&t[1]>=6?+sr(t[0],t[1]).toFixed(1):null})}))})};
function roleOf(id){const b=getB('ALL','all',id),w=getW('ALL','all',id),pd=P[id];if(b[1]>=150&&w[0]>=120)return'All-rounder';if(w[0]>=120&&w[0]*1.5>b[1])return pd.ps=='Spin'?'Spin bowler':'Pace bowler';if(b[1]>=60)return pd.bo>=5&&getB('ALL','death',id)[1]>=40?'Finisher':pd.bo<=3?'Top-order bat':'Middle-order bat';return'Unclassified'}
function tiers(){const C=cats(),out=[];const add=(r,t,role,alts)=>out.push({...r,tier:t,role,alts});
 const take=(list,role,kind)=>{const nr=list.filter(r=>!P[r.id].rr);nr.slice(0,5).forEach((r,i)=>{const alts=nr.filter(x=>x.id!=r.id).slice(i<5?5:0,i<5?7:2).map(x=>x.n);add(r,r.pb>=(kind=='B'?120:90)&&(r.cons>=.45)?'Priority target':'High-risk / high-reward',role,alts)});
  nr.slice(5,8).forEach(r=>add(r,'Alternative target',role,nr.slice(0,2).map(x=>x.n)))};
 take(C.Batters.filter(r=>!(r.bo>=5&&r.dB>=40)),'Top/middle-order batter','B');take(C.Finishers,'Finisher','B');take(C['Pace bowlers'],'Pace bowler','W');take(C['Spin bowlers'],'Spin bowler','W');
 [['Batters','B'],['Pace bowlers','W'],['Spin bowlers','W']].forEach(([k,kind])=>{const lo=(kind=='B'?batters():bowlers()).filter(r=>r.pb>=(kind=='B'?30:24)&&r.pb<(kind=='B'?st.minB:st.minW)&&(kind=='B'||(k=='Pace bowlers'?r.ps=='Pace':r.ps=='Spin'))&&!P[r.id].rr).sort((a,b)=>b.score-a.score).slice(0,2);lo.forEach(r=>add(r,'Development prospect',k.replace(/s$/,''),[]))});
 const seen={};return out.filter(r=>{const k=r.id+r.tier;if(seen[r.id])return false;seen[r.id]=1;return true})}
S.G=()=>{const T=tiers();const rr=D.players.filter(p=>p.rr),rc={};rr.forEach(p=>{const r=roleOf(p.id);rc[r]=(rc[r]||0)+1});
 const need=Object.entries({'Top-order bat':2,'Middle-order bat':2,'Finisher':2,'All-rounder':2,'Pace bowler':4,'Spin bowler':2}).map(([k,v])=>[k,v,rc[k]||0]);
 return`<h2>RR Auction Strategy</h2><p class="sub">Shortlist from pressure data · ${st.grp}</p>
 <div class="warn"><b>Availability, base price, age, nationality and retention status are not in the dataset and were not verified.</b> Players are shown only as data-driven candidates; confirm the official 2027 auction list before acting. Current RR players (IPL 2026 mapping) are excluded from target lists.</div>
 ${card('Squad composition (IPL 2026 RR mapping, role inferred from ball data)','Count of mapped players per inferred role vs an illustrative need level (planning assumption, not a confirmed requirement)',table('nd',[['k','Role'],['c','In 2026 mapping'],['t','Illustrative target'],['g','Gap']],need.map(([k,t,c])=>({k,t,c,g:Math.max(0,t-c)})),'g'))}
 ${['Priority target','Alternative target','Development prospect','High-risk / high-reward'].map(t=>card(t+'s',{'Priority target':'Top-5 by role with ≥ sample threshold and consistency ≥45%','Alternative target':'Ranks 6–8 by role','Development prospect':'Smaller samples (below the minimum) but high index','High-risk / high-reward':'Top-5 by role but thin sample or inconsistent'}[t],T.filter(r=>r.tier==t).map(r=>{const bat=r.pSR!==undefined;return`<div class="card" style="margin:8px 0"><b>${r.n}</b> <span class="tag">${r.role}</span> <span class="tag n">${r.t||'not in IPL 2026 mapping'}</span> <span class="tag g">availability: unverified</span>
 <p style="margin:6px 0"><b>1. Why:</b> ${bat?`Pressure SR ${f1(r.pSR)} vs league ${f1(sr(...lgBat('press').slice(0,2)))}, dismissed once per ${r.po?f1(r.pb/r.po):'∞'} pressure balls.`:`Pressure economy ${f2(r.pE)} vs league ${f2(ec(lgBowl('press')[0],lgBowl('press')[1]))}, ${r.pw} wickets.`}<br>
 <b>2. Evidence:</b> score ${f1(r.score)} on ${r.pb} pressure balls; consistency ${pc(r.cons)} over ${r.cq} ${bat?'innings':'spells'}.<br><b>3. Role:</b> ${r.role}.<br>
 <b>4. Potential contribution:</b> ${bat?`${r.dB} death balls at SR ${f1(r.dSR)}; ${r.chB} high-pressure chase balls at SR ${f1(r.chSR)}.`:`Death econ ${f2(r.dE)} (${r.dB} b); PP econ ${f2(r.ppE)} (${r.ppB} b).`}<br>
 <b>5. Risks:</b> ${r.pb<100?'Small sample — rating can swing. ':''}${r.cons<.45?'Below-average consistency. ':''}Mix of IPL and T20I data; no age/fitness/price data; association not proof of temperament.<br><b>6. Alternatives:</b> ${r.alts.length?r.alts.join(', '):'—'}</p><button onclick="addSq(${r.id},'${r.role}')">+ Squad builder</button></div>`}).join('')||'<p class="def">None at current filters.</p>')).join('')}`};
const ROLES=['Top-order bat','Middle-order bat','Finisher','All-rounder','Pace bowler','Spin bowler','Wicketkeeper'];
window.addSq=(id,role)=>{const q=st.squad[st.scn];if(!q.find(x=>x.id==id)){const m={'Top/middle-order batter':'Middle-order bat','Pace bowler':'Pace bowler','Spin bowler':'Spin bowler','Finisher':'Finisher'};q.push({id,role:ROLES.includes(role)?role:m[role]||roleOf(id).replace('Unclassified','Middle-order bat'),nat:P[id].ind?'Indian (T20I-cap proxy)':'Overseas / unknown'})}if(st.sec=='G')alert('Added to scenario '+st.scn)};
S.H=()=>{const q=st.squad[st.scn],cnt={};ROLES.forEach(r=>cnt[r]=0);q.forEach(x=>cnt[x.role]++);const ov=q.filter(x=>x.nat.startsWith('Over')).length;const need={'Top-order bat':2,'Middle-order bat':2,'Finisher':2,'All-rounder':2,'Pace bowler':4,'Spin bowler':2,'Wicketkeeper':1};
 const pool=D.players.filter(p=>getB('ALL','all',p.id)[1]>=100||getW('ALL','all',p.id)[0]>=60);
 return`<h2>Squad Builder</h2><p class="sub">Hypothetical planning tool</p><div class="warn"><b>Not a confirmed 2027 squad.</b> Nationality is not in the data: “Indian” defaults from India T20I mapping and can be edited. Squad-size/overseas limits are planning assumptions (25 / 8) to verify against IPL rules.</div>
 <div class="bar">${['A','B'].map(s=>`<button class="${st.scn==s?'p':''}" onclick="st.scn='${s}';render()">Scenario ${s} (${st.squad[s].length})</button>`).join('')}<input list="pl2" id="sp" placeholder="Add player…"><datalist id="pl2">${pool.map(p=>`<option value="${p.n}">`).join('')}</datalist><button onclick="const p=D.players.find(x=>x.n==$('#sp').value);if(p){addSq(p.id,roleOf(p.id));render()}">Add</button><button onclick="st.squad[st.scn]=[];render()">Clear</button></div>
 <div class="grid g2">${card('Role distribution','Selected players per role vs illustrative need',`<div id="c1" class="chart"></div>`)}
 ${card('Gaps & checks','',`<ul>${Object.entries(need).map(([k,v])=>`<li>${k}: ${cnt[k]}/${v} ${cnt[k]<v?'<span class="tag">missing '+(v-cnt[k])+'</span>':'✓'}</li>`).join('')}<li>Overseas (as labelled): ${ov}/8 ${ov>8?'<span class="tag">over limit</span>':''}</li><li>Squad size: ${q.length}/25</li></ul>`)}</div>
 ${card('Scenario '+st.scn+' squad','Edit role and nationality',`<table><tr><th class="l">Player</th><th>Role</th><th>Nationality</th><th>Pressure score</th><th></th></tr>${q.map((x,i)=>{const bw=getW('ALL','all',x.id)[0]>getB('ALL','all',x.id)[1];const s=bw?bowlRow(x.id,'ALL'):batRow(x.id,'ALL');return`<tr><td class="l">${P[x.id].n}</td><td><select onchange="st.squad[st.scn][${i}].role=this.value;render()">${ROLES.map(r=>`<option ${r==x.role?'selected':''}>${r}</option>`).join('')}</select></td><td><select onchange="st.squad[st.scn][${i}].nat=this.value;render()">${['Indian (T20I-cap proxy)','Indian','Overseas / unknown','Overseas'].map(r=>`<option ${r==x.nat?'selected':''}>${r}</option>`).join('')}</select></td><td>${f1(s.score)}</td><td><button onclick="st.squad[st.scn].splice(${i},1);render()">✕</button></td></tr>`}).join('')}</table>`)}
 ${card('Compare scenarios','Role counts A vs B',`<div id="c2" class="chart"></div>`)}`};
S.H.after=()=>{const c=s=>ROLES.map(r=>st.squad[s].filter(x=>x.role==r).length);ch('c1',{xAxis:{type:'category',data:ROLES,axisLabel:{rotate:30}},yAxis:{type:'value',name:'Players',minInterval:1},series:[{type:'bar',data:c(st.scn),itemStyle:{color:'#ea1a8c'}}]});
 ch('c2',{legend:{bottom:0},xAxis:{type:'category',data:ROLES,axisLabel:{rotate:30}},yAxis:{type:'value',name:'Players',minInterval:1},series:['A','B'].map(s=>({name:'Scenario '+s,type:'bar',data:c(s)}))})};
const NAV=[['A','Executive Overview'],['B','Pressure Analytics'],['C','Batting Intelligence'],['D','Bowling Intelligence'],['E','Pressure Rankings'],['F','Player Comparison Lab'],['G','RR Auction Strategy'],['H','Squad Builder']];
function render(){charts.splice(0).forEach(c=>c.dispose());$('#nav').innerHTML=NAV.map(([k,n])=>`<a class="${k==st.sec?'on':''}" onclick="st.sec='${k}';render();scrollTo(0,0)">${n}</a>`).join('');
 const y=scrollY;try{$('#main').innerHTML=S[st.sec]();S[st.sec].after&&S[st.sec].after()}catch(e){console.error(e);$('#main').innerHTML='<div class="warn">Render error: '+e.message+'</div>'}scrollTo(0,y)}
render();
</script></body></html>
